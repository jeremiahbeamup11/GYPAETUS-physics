[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gypaetus-physics"
version = "0.1.0"
description = "Reproducible air-breathing transonic performance screening"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]

[project.scripts]
gypaetus = "gypaetus.cli:main"

[tool.setuptools.packages.find]
include = ["gypaetus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

